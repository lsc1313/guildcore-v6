name: Package GuildCore Kakao Bot
on:
  push:
    paths:
      - '.github/workflows/package-kakao-bot.yml'
      - 'kakao-bot/**'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and pack
        run: |
          set -e
          node --check "kakao-bot/GuildCore_KakaoBot_API2_웹출석_복구판.js"
          mkdir -p package
          cp "kakao-bot/GuildCore_KakaoBot_API2_웹출석_복구판.js" package/GuildCore_KakaoBot_API2.js
          printf '%s\n' 'Keep the existing KAKAO_INPUT_KEY when updating MessengerBotR.' 'Back up your existing script before replacing it.' > package/README.txt
          cd package
          zip -9 -r ../GuildCore_KakaoBot.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: GuildCore-KakaoBot-ZIP
          path: GuildCore_KakaoBot.zip
          retention-days: 7
